name: ❓ Question about the CLI
description: Ask about Alpaca CLI after checking the documentation
title: "[Question]: "
labels: [question]
assignees: []
body:
  - type: markdown
    attributes:
      value: |
        Ask CLI-specific questions here in English. General API questions go to the [Community Forum](https://forum.alpaca.markets/) or [Slack](https://alpaca.markets/slack), and API bugs go to [alpacahq/alpaca-api](https://github.com/alpacahq/alpaca-api/issues/new/choose). Questions about your account, funding, or orders go to a [support request](https://alpaca.markets/support/request).

        Never include API keys, account details, request or trace IDs, or other secrets.

  - type: checkboxes
    id: preflight
    attributes:
      label: Preflight
      options:
        - label: I searched the documentation (including `alpaca --help-all`) and existing issues.
          required: true
        - label: My question has to do with this CLI and isn't a general question about the API. General API questions go to the Community Forum or Slack, and API bugs go to alpacahq/alpaca-api.
          required: true
        - label: My question is not asking for a trading strategy, algorithm design, or investment advice.
          required: true

  - type: input
    id: cli_version
    attributes:
      label: CLI version
      description: Provide the output of `alpaca version` when the question concerns observed behavior.
      placeholder: alpaca v0.0.x, or Not applicable

  - type: input
    id: environment
    attributes:
      label: Environment context
      description: Include the OS, architecture, install method, and affected command when relevant.
      placeholder: macOS arm64, installed with Homebrew, using alpaca data bars, or Not applicable

  - type: textarea
    id: question
    attributes:
      label: Question
      description: Explain what you are trying to accomplish and what you already tried.
    validations:
      required: true

  - type: checkboxes
    id: sensitive_data
    attributes:
      label: Sensitive-data check
      options:
        - label: I removed API keys, credentials, account details, request or trace IDs, and other sensitive information.
          required: true
